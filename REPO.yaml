standard:
  name: ello-repo-standard
  version: "1.0.0"
  mode: migrate

repo:
  name: sigrank-app
  type: product
  lifecycle: superseded
  repo_id: sigrank_app
  family: sigrank
  purpose: SigRank SignalAF — AI operator evaluation leaderboard. Ranks how efficiently you use AI by token cascade efficiency. Privacy-preserving: token counts only, never prompt content.

structure:
  profile: product
  allowed_root_dirs_extra: [__tests__, app, components, content, datasets, Devins_Plans, e2e, governance, lib, methodology, observatory, ontology, papers, research, supabase, workflows, system-devin]
  allowed_root_files_extra: [banner.svg, lighthouserc.json, middleware.ts, NOTICE, playwright.config.ts, postcss.config.mjs, skills-lock.json, tailwind.config.ts, vitest.config.ts, vitest.setup.ts]
  document_roots: [docs]
  artifact_roots: [artifacts]
  archive_roots: [archive, docs/archive]

naming:
  forbid_version_suffixes: true
  forbidden_suffixes: [_final, _final2, _new, _updated, _revised, _copy]

knowledge:
  okf_enabled: true
  okf_roots: [docs, .coord]
  okf_severity: warn

coordination:
  micro_enabled: true
  micro_root: .coord/micro
  macro_enabled: true
  macro_root: .coord/macro
  backend: drep
  drep_root: system-devin
  owner_role: OWNER
  rep1_role: LEAD
  rep2_role: ASSIST

github:
  ruleset_profile: solo-fast
  required_check: repo-standard

canon:
  authority_role: implementation
  canon_contexts: [sigrank]
  authority_owner_repo: search_authority
