<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15120c"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#e6a3c8"/>
      <stop offset="22%" stop-color="#e8924a"/>
      <stop offset="55%" stop-color="#e8b955"/>
      <stop offset="100%" stop-color="#f0d28a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6a3c8"/>
      <stop offset="50%" stop-color="#e8b955"/>
      <stop offset="100%" stop-color="#f0d28a"/>
    </linearGradient>
  </defs>

  <!-- Dark background (non-transparent) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Gold accent ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.6"/>

  <!-- ⊙ symbol (circle + dot) in gold gradient -->
  <circle cx="256" cy="180" r="48" fill="none" stroke="url(#wm)" stroke-width="8"/>
  <circle cx="256" cy="180" r="10" fill="url(#wm)"/>

  <!-- SigRank wordmark — terminal block-art, scaled down for icon -->
  <g font-family="'Courier New', Courier, monospace" font-weight="700"
     fill="url(#wm)" text-anchor="middle" xml:space="preserve">
    <text x="256" y="270" font-size="20">███████ ██  ██████  ██████   █████  ███    ██  ██   ██</text>
    <text x="256" y="292" font-size="20">██      ██ ██       ██   ██ ██   ██ ████   ██  ██  ██ </text>
    <text x="256" y="314" font-size="20">███████ ██ ██   ███ ██████  ███████ ██ ██  ██  █████  </text>
    <text x="256" y="336" font-size="20">     ██ ██ ██    ██ ██   ██ ██   ██ ██  ██ ██  ██  ██ </text>
    <text x="256" y="358" font-size="20">███████ ██  ██████  ██   ██ ██   ██ ██   ████  ██   ██</text>
  </g>

  <!-- signalaf.com at bottom -->
  <text x="256" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="16" fill="#6b6354" letter-spacing="2">signalaf.com</text>
</svg>
