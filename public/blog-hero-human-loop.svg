<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0d0a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4923a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f0c862;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#c4923a" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>
  <!-- Token cascade flow: I → W → R → O -->
  <g font-family="monospace" font-size="11" fill="#6e8a6e">
    <text x="80" y="50" letter-spacing="2">INPUT</text>
    <text x="280" y="50" letter-spacing="2">CACHE WRITE</text>
    <text x="520" y="50" letter-spacing="2">CACHE READ</text>
    <text x="760" y="50" letter-spacing="2">OUTPUT</text>
  </g>
  <!-- Flow bars -->
  <rect x="80" y="70" width="120" height="8" rx="4" fill="#5dade2" opacity="0.6"/>
  <rect x="280" y="70" width="180" height="8" rx="4" fill="#f39c12" opacity="0.6"/>
  <rect x="520" y="70" width="220" height="8" rx="4" fill="#27ae60" opacity="0.7"/>
  <rect x="760" y="70" width="100" height="8" rx="4" fill="#e74c3c" opacity="0.6"/>
  <!-- Human silhouette in center -->
  <g transform="translate(600, 220)">
    <circle cx="0" cy="-40" r="20" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M -25 -15 Q -25 10, -15 30 L 15 30 Q 25 10, 25 -15 Z" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <!-- Signal lines radiating from human -->
    <g stroke="#c4923a" stroke-width="1" opacity="0.3">
      <line x1="-25" y1="0" x2="-120" y2="0"/>
      <line x1="25" y1="0" x2="120" y2="0"/>
      <line x1="-15" y1="-30" x2="-80" y2="-60"/>
      <line x1="15" y1="-30" x2="80" y2="-60"/>
      <line x1="-15" y1="30" x2="-60" y2="80"/>
      <line x1="15" y1="30" x2="60" y2="80"/>
    </g>
  </g>
  <!-- Yield curve — long tail -->
  <path d="M 80 350 Q 200 350, 300 340 Q 500 320, 700 280 Q 900 200, 1100 80" 
        fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <!-- Labels -->
  <text x="600" y="380" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a5a4a" letter-spacing="3">
    THE UNMEASURED LAYER
  </text>
</svg>
