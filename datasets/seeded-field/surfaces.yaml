# surfaces.yaml — Public Surface Map
# Every public surface that renders seeded-field objects. Surfaces consume
# indexed objects — they are explainers, never raw-data authority.
version: 1.0.0
surfaces:

  - id: SURF-001
    surface: signalaf.com/research
    type: dataset_landing + research_index
    consumes: [SRC-PUB-001 (Zenodo v3.1 link), POP-TAXONOMY-1627, CLS-ARCHETYPE, CLS-EXPERIENCE, CLS-CLASS-DIST-REFERENCE]
    defines_or_explains: explains
    status: current
    notes:
      - "FAQ labels 'OCM' = 1,498 — conflicts with canon OCM = 1,586 (GAP-030, flagged for owner)"
      - "renders DOIs + per-file Zenodo links for all v3.1 assets; headline 1,628 ops / 17 platforms / 3,304 models"

