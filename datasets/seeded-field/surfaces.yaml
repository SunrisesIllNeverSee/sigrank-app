    defines_or_explains: fallback/dev fixture
    status: current
    notes: ["MO§ES invariant entity present in mock — exactly one, canonical display MO§ES™"]

  - id: SURF-014
    surface: MCP plugin contract (sigrank-app lib/mcp/plugin/contracts.json)
    type: protocol_surface
    consumes: [provenance enum data_origin: historical_seed; measurement_class enums]
    defines_or_explains: declares provenance classes
    status: current
    notes: ["provenance is first-class in the app↔MCP contract — seeded data can be labeled historical_seed", "the contract file lives in sigrank-app; sigrank-mcp is the consuming server — no matching tokens found in the mcp repo"]

  - id: SURF-015
