  - id: SURF-010
    surface: seeded operator profiles (public/data/*.json assets)
    type: data_surface
    consumes: [archetypes.json, archetype-labels-ocm.json, class-distribution-reference.json, experience_ladder.json, field-analysis.json]
    defines_or_explains: renders
    status: current
    notes: ["served live from sigrank-app/public/data/ — surface map complete (GAP-015 closed)"]

  - id: SURF-011
    surface: SigAdmin /data explorer (sigadmin-web)
    type: exploration_tool
    consumes: [SRC-SEED-008 tokscale-dataset.json copy]
    defines_or_explains: explores (distributions, percentiles, histograms, correlations, cross-tabs)
    status: current
    notes:
      - "locator/explorer/reference implementation — NOT authoritative for metric defs/quantile convention/classification policy"
      - "consumes the FULLY anonymized derivative (all 1,628 handles are signal- IDs, not raw-authority bytes)"
      - "quantile convention: linear (n-1) interpolation = R type-7 / PERCENTILE.INC; population stdev ÷n; Pearson r"

  - id: SURF-012
    surface: Supabase materialization (supabase/seeds/tokscale_seed_full.sql)
    type: database_seed
    consumes: [POP-TAXONOMY-1627 cohort — 1,627 operators real 4-pillar data]
    defines_or_explains: materializes
    status: current
    notes:
      - "carries the 1,627 taxonomy cohort, NOT the raw 1,628 corpus (GAP-027)"
      - "live board reads public operator views / metric snapshots / rank history via lib/board/queries.ts"
      - "live ingest path: POST /api/v1/snapshots (signed) → gate chain → materialization — independent of seeded statics"

