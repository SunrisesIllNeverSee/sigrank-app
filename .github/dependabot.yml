# Dependabot — automated dependency update PRs.
# Opens weekly PRs for npm packages and GitHub Actions versions, and surfaces
# security advisories as soon as they're published in GitHub's advisory database.
# This file alone does not auto-merge; repo setting "Allow auto-merge" +
# branch rules would be needed, and neither is enabled.
version: 2
updates:
  # npm dependencies (package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    # Group patch updates so they land in one PR instead of ten.
    groups:
      patch-updates:
        update-types:
          - "patch"
    # tailwindcss v4 moves the PostCSS plugin to @tailwindcss/postcss and
    # drops @tailwind directives — this repo's postcss.config.mjs + CSS are
    # v3. A v4 migration is a project, not a bump; hold majors.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions used in workflows (keeps actions/checkout etc. current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
