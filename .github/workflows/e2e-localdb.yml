name: E2E localdb (warning)

# Owner approved 2026-11-05: sign-up and submit journeys run against a throwaway
# local Supabase started inside this job from the repo's migrations + seed.
# Never touches production and uses no repo secrets. NON-BLOCKING warning.
# The test auth config lives in e2e/localdb/supabase-config.toml and is copied
# into a scratch workdir, so no supabase/config.toml is added to the repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-localdb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-localdb:
    name: e2e localdb (warning, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # repo .nvmrc pin
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.98.2

      - name: Assemble scratch Supabase workdir
        run: |
          mkdir -p "$RUNNER_TEMP/sb/supabase"
          cp e2e/localdb/supabase-config.toml "$RUNNER_TEMP/sb/supabase/config.toml"
          cp -r supabase/migrations "$RUNNER_TEMP/sb/supabase/migrations"
          cp supabase/seed.sql "$RUNNER_TEMP/sb/supabase/seed.sql"

      - name: Start local Supabase (migrations + seed)
        run: supabase start --workdir "$RUNNER_TEMP/sb" -x studio,imgproxy,vector,logflare,edge-runtime,storage-api,postgres-meta,supavisor

      - name: Replay from scratch
        run: supabase db reset --workdir "$RUNNER_TEMP/sb"

      - name: Export local endpoints and keys
        run: |
          supabase status --workdir "$RUNNER_TEMP/sb" -o env > "$RUNNER_TEMP/sb.env"
          get() { grep "^$1=" "$RUNNER_TEMP/sb.env" | cut -d= -f2- | tr -d '"'; }
          for v in API_URL ANON_KEY SERVICE_ROLE_KEY; do echo "::add-mask::$(get $v)"; done
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "E2E_LOCAL_SUPABASE_URL=$(get API_URL)"
            echo "E2E_LOCAL_SERVICE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "E2E_LOCAL_MAILPIT_URL=http://127.0.0.1:54324"
            echo "E2E_BASE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      - name: Build app against local Supabase
        run: npm run build

      - name: Start app
        run: |
          nohup npm run start -- -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/login && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Run localdb journeys
        run: npx playwright test --project=localdb --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-localdb
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/sb" --no-backup
