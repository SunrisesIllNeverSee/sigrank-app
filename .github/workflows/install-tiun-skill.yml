name: Install tiun skill

on:
  push:
    paths:
      - '.github/workflows/install-tiun-skill.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install tiun-sdk skill
        run: npx skills add https://mcp.tiun.business --yes
      - name: Commit installed skill and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/install-tiun-skill.yml
          echo "Installed files:"
          git status --short
          git commit -m "chore: install tiun-sdk skill"
          git push
