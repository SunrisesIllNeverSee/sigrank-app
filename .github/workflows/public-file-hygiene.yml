name: Public file hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/check-public-files.py --self-test
      - run: python3 scripts/check-public-files.py
