name: CI

# Restored in PR-3 (repo-cleanup): slim truthful gate mirroring AGENTS.md's
# verification protocol + REPO_CLEANUP_PLAN §16 hygiene controls.
# The wider suite (CodeQL, dependency-audit, Playwright E2E, Lighthouse,
# gitleaks secret-scan) stays archived at _archive/workflows/ pending
# separate owner decisions — do NOT re-enable by copying wholesale; each of
# those carried its own secrets/trigger surface.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: hygiene + types + canonical tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # repo .nvmrc pin
          cache: npm

      # `npm ci` currently fails — package.json↔package-lock.json desync is a
      # known baseline ledger item pending its own dependency PR (P-06).
      # Until then `npm install` resolves from package.json; switch back to
      # `npm ci` once the lockfile is resynced.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Repo hygiene (broken symlinks + tracked-ignored files)
        run: node scripts/check-repo-hygiene.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Canonical contract tests
        run: npm run test:canonical

      - name: TTEOP protocol + legacy compatibility gates
        run: >-
          node --test
          __tests__/standard/tteop-conformance.test.mjs
          __tests__/standard/legacy-alias-compatibility.test.mjs
          __tests__/standard/standalone-fixture-conformance.test.mjs

      - name: Checkout sigrank-mcp for generated-record contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: SunrisesIllNeverSee/sigrank-mcp
          path: _sigrank-mcp

      - name: Install sigrank-mcp contract dependencies
        run: npm ci --prefix _sigrank-mcp --ignore-scripts --no-audit --no-fund

      - name: Cross-repo generated-record contract
        env:
          OTHER_REPO_ROOT: ${{ github.workspace }}/_sigrank-mcp
        run: node --test __tests__/standard/generated-record-contract.test.mjs
