name: One-time Dataset license fix

on:
  push:
    paths:
      - ".github/workflows/fix-dataset-license.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add CC BY 4.0 license to aggregate Dataset JSON-LD
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/jsonld.ts")
          text = path.read_text()
          needle = '''    creator: { "@id": ORG_ID },
    isAccessibleForFree: true,
    keywords: [
'''
          replacement = '''    creator: { "@id": ORG_ID },
    isAccessibleForFree: true,
    license: "https://creativecommons.org/licenses/by/4.0/",
    keywords: [
'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f"Expected exactly one aggregate Dataset target, found {count}")
          path.write_text(text.replace(needle, replacement, 1))
          PY

          rm .github/workflows/fix-dataset-license.yml

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/jsonld.ts .github/workflows/fix-dataset-license.yml
          git commit -m "fix: add Dataset license structured data [skip ci]"
          git push
