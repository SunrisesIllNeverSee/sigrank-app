name: Sync MCP version

# Checks npm for the latest sigrank-mcp version AND checks out the MCP repo to
# count ALL_PLATFORMS.length. Updates MCP_VERSION and PLATFORM_COUNT in
# lib/constants.ts if either has drifted. Runs on schedule (daily) + on demand.
#
# No CROSS_REPO_PAT needed — this repo checks npm directly (public, no auth)
# and the MCP repo is public. Commits to its own main using GITHUB_TOKEN.
#
# This replaces the old repository_dispatch approach which required a PAT
# on both repos. Simpler, fewer secrets, same result.

on:
  schedule:
    # Daily at 07:00 UTC (1h after the MCP publish window at 06:00)
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-mcp-version.yml"

permissions:
  contents: write

jobs:
  sync:
    name: Check npm + sync MCP_VERSION + PLATFORM_COUNT
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # Check out the MCP repo to count ALL_PLATFORMS at runtime (the only
      # source of truth for platform count). npm metadata doesn't expose this.
      - name: Checkout sigrank-mcp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SunrisesIllNeverSee/sigrank-mcp
          path: _sigrank-mcp

      - name: Check npm version + platform count vs constants
        id: check
        run: |
          NPM_VERSION=$(npm view sigrank version 2>/dev/null)
          CURRENT_VERSION=$(grep -oP 'MCP_VERSION\s*=\s*"[^"]+"' lib/constants.ts | grep -oP '"[^"]+"' | tr -d '"')
          CURRENT_COUNT=$(grep -oP 'PLATFORM_COUNT\s*=\s*\d+' lib/constants.ts | grep -oP '\d+')

          # Count ALL_PLATFORMS by importing the MCP's adapters module
          MCP_COUNT=$(node -e "
            import('${{ github.workspace }}/_sigrank-mcp/adapters.mjs')
              .then(m => process.stdout.write(String(m.ALL_PLATFORMS.length)))
              .catch(() => process.stdout.write('0'));
          ")

          echo "npm version:     $NPM_VERSION"
          echo "current version: $CURRENT_VERSION"
          echo "mcp platforms:   $MCP_COUNT"
          echo "current count:   $CURRENT_COUNT"

          NEEDS_UPDATE=false

          if [ -z "$NPM_VERSION" ]; then
            echo "✗ Could not fetch npm version — skipping version sync"
          elif [ "$NPM_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Version drift: $CURRENT_VERSION → $NPM_VERSION"
            NEEDS_UPDATE=true
            echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Version already in sync ($NPM_VERSION)"
          fi

          if [ -z "$MCP_COUNT" ] || [ "$MCP_COUNT" = "0" ]; then
            echo "✗ Could not count MCP ALL_PLATFORMS — skipping platform sync"
          elif [ "$MCP_COUNT" != "$CURRENT_COUNT" ]; then
            echo "Platform count drift: $CURRENT_COUNT → $MCP_COUNT"
            NEEDS_UPDATE=true
            echo "mcp_platform_count=$MCP_COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "Platform count already in sync ($MCP_COUNT)"
          fi

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Update MCP_VERSION + PLATFORM_COUNT
        if: steps.check.outputs.needs_update == 'true'
        run: |
          NPM_VERSION="${{ steps.check.outputs.npm_version }}"
          MCP_COUNT="${{ steps.check.outputs.mcp_platform_count }}"

          if [ -n "$NPM_VERSION" ]; then
            sed -i "s/export const MCP_VERSION = \"[^\"]*\"/export const MCP_VERSION = \"$NPM_VERSION\"/" lib/constants.ts
            UPDATED_V=$(grep -oP 'MCP_VERSION\s*=\s*"[^"]+"' lib/constants.ts | grep -oP '"[^"]+"' | tr -d '"')
            if [ "$UPDATED_V" != "$NPM_VERSION" ]; then
              echo "✗ FAIL: MCP_VERSION not updated correctly"
              exit 1
            fi
            echo "✓ MCP_VERSION → $NPM_VERSION"
          fi

          if [ -n "$MCP_COUNT" ]; then
            sed -i "s/export const PLATFORM_COUNT = [0-9]*/export const PLATFORM_COUNT = $MCP_COUNT/" lib/constants.ts
            UPDATED_C=$(grep -oP 'PLATFORM_COUNT\s*=\s*\d+' lib/constants.ts | grep -oP '\d+')
            if [ "$UPDATED_C" != "$MCP_COUNT" ]; then
              echo "✗ FAIL: PLATFORM_COUNT not updated correctly"
              exit 1
            fi
            echo "✓ PLATFORM_COUNT → $MCP_COUNT"
          fi

      - name: Commit + push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/constants.ts
          git commit -m "chore: sync MCP_VERSION + PLATFORM_COUNT [skip ci]"
          git push origin main
          echo "✓ Pushed. Vercel will auto-deploy."
